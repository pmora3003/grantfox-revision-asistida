version: "1.1"
fecha: "2026-10-07"

niveles:
  - nombre: bajo
    min: 20
    max: 40
  - nombre: medio
    min: 41
    max: 70
  - nombre: alto
    min: 71
    max: 100
  - nombre: spike
    min: 101
    max: null

# Informativo: techo observado en el registro historico (no acota el nivel spike).
techo_observado: 150

confianza:
  alto_desde: 0.85
  medio_desde: 0.60
  penalizaciones:
    truncado: 0.25
    tarea_no_corresponde: 0.25
    evidencia_insuficiente_excesiva: 0.20
    dependencia_externa: 0.40
    reglas: 0.20
  umbral_evidencia_insuficiente: 0.30

reglas:
  lineas_medio: 150
  lineas_alto: 400
  lineas_spike: 900
  archivos_medio: 6
  archivos_alto: 10
  archivos_spike: 15

severidad:
  CR-001: alta
  CR-002: media
  CR-003: alta
  CR-004: baja
  CR-005: media
  CR-006: baja
  CR-007: baja
  CR-008: media
  CR-009: baja
  CR-010: alta
  CR-011: media
  CR-012: baja
  CR-013: alta
  CR-014: alta
  CR-015: media
  CR-016: alta
  CR-017: media
  CR-018: media
  CR-019: baja
  CR-020: baja
  CR-021: baja
  CR-022: media
  CR-023: media

# Reglas de recomendacion que dependen de criterios concretos (decision del
# proyecto). Un criterio de rechazo_directo en no_cumple produce rechazo; uno de
# derivar_si_no_cumple en no_cumple deriva a revision humana. Los pesos de
# pesos_severidad solo ordenan la cola (RF-15).
recomendacion:
  rechazo_directo: [CR-003, CR-010, CR-013, CR-016]
  derivar_si_no_cumple: [CR-001, CR-011, CR-014]

pesos_severidad:
  alta: 3
  media: 2
  baja: 1

modelo:
  nombre: claude-sonnet-5-5
  # el modelo no admite parametros de muestreo; la variacion se reduce con
  # salida estructurada por esquema, instruccion versionada fija y etapas
  # deterministas fuera del modelo (RNF-04).
  esfuerzo: medium
  max_tokens: 4096
