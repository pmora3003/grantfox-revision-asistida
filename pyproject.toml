[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revision-asistida"
version = "0.1.0"
description = "Prototipo de revision asistida de contribuciones tecnicas GrantFox"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
revisar = "revision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
