<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revisión asistida GrantFox</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #d8dce3;
      --text: #1a1d23;
      --muted: #5c6370;
      --accent: #2563eb;
      --banner-bg: #fef3c7;
      --banner-text: #78350f;
      --chip-bg: #e5e7eb;
      --row-hover: #eef2ff;
      --row-active: #dbeafe;
      --cumple: #15803d;
      --parcial: #a16207;
      --no-cumple: #b91c1c;
      --insuf: #6b7280;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --surface: #181b22;
        --border: #2d333b;
        --text: #e6edf3;
        --muted: #9aa4b2;
        --accent: #60a5fa;
        --banner-bg: #3b2f1a;
        --banner-text: #fde68a;
        --chip-bg: #2d333b;
        --row-hover: #1e2430;
        --row-active: #1e3a5f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      background: var(--bg);
      color: var(--text);
    }
    h1, h2, h3 { margin: 0 0 0.5rem; font-size: 1rem; font-weight: 600; }
    .app {
      display: grid;
      grid-template-columns: minmax(260px, 340px) 1fr;
      min-height: 100vh;
    }
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .cola { max-height: 42vh; border-right: none; border-bottom: 1px solid var(--border); }
    }
    .cola, .detalle {
      padding: 1rem 1.1rem;
      overflow: auto;
    }
    .cola {
      background: var(--surface);
      border-right: 1px solid var(--border);
    }
    .detalle { padding-bottom: 2rem; }
    .filtros { margin-bottom: 0.75rem; }
    .filtros label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
    .filtros select {
      width: 100%;
      padding: 0.45rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
    }
    .lista { list-style: none; margin: 0; padding: 0; }
    .fila {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 0.65rem;
      margin-bottom: 0.45rem;
      cursor: pointer;
      background: var(--bg);
    }
    .fila:hover { background: var(--row-hover); }
    .fila.activa { background: var(--row-active); border-color: var(--accent); }
    .fila-id { font-family: ui-monospace, monospace; font-size: 0.82rem; }
    .fila-meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.25rem; }
    .chip {
      display: inline-block;
      font-size: 0.72rem;
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
      background: var(--chip-bg);
      margin-right: 0.25rem;
    }
    .chip.rec-aprobar { background: #dcfce7; color: #166534; }
    .chip.rec-rechazar { background: #fee2e2; color: #991b1b; }
    .chip.rec-ajustar_monto { background: #ffedd5; color: #9a3412; }
    .chip.rec-derivar_revision_humana { background: #e0e7ff; color: #3730a3; }
    @media (prefers-color-scheme: dark) {
      .chip.rec-aprobar { background: #14532d; color: #bbf7d0; }
      .chip.rec-rechazar { background: #7f1d1d; color: #fecaca; }
      .chip.rec-ajustar_monto { background: #7c2d12; color: #fed7aa; }
      .chip.rec-derivar_revision_humana { background: #312e81; color: #c7d2fe; }
    }
    .banner {
      background: var(--banner-bg);
      color: var(--banner-text);
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin-bottom: 0.75rem;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td {
      text-align: left;
      vertical-align: top;
      padding: 0.4rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--muted); font-weight: 500; }
    .nivel { font-weight: 600; }
    .nivel-cumple { color: var(--cumple); }
    .nivel-cumple_parcialmente { color: var(--parcial); }
    .nivel-no_cumple { color: var(--no-cumple); }
    .nivel-evidencia_insuficiente { color: var(--insuf); }
    pre.frag {
      margin: 0.25rem 0 0;
      padding: 0.45rem 0.5rem;
      font-size: 0.75rem;
      background: var(--bg);
      border-radius: 4px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .caja-recompensa {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.5rem;
    }
    .caja-recompensa div {
      padding: 0.5rem;
      background: var(--bg);
      border-radius: 6px;
      font-size: 0.88rem;
    }
    .alerta { color: var(--no-cumple); font-size: 0.85rem; margin-top: 0.35rem; }
    ul.plano { margin: 0.25rem 0 0; padding-left: 1.2rem; }
    .vacio { color: var(--muted); padding: 2rem 1rem; text-align: center; }
    .titulo-app { font-size: 1.05rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="cola">
      <div class="titulo-app">Cola de revisión</div>
      <div class="filtros">
        <label for="filtro-rec">Filtrar por recomendación</label>
        <select id="filtro-rec">
          <option value="">Todas</option>
        </select>
      </div>
      <ul class="lista" id="lista-cola"></ul>
    </aside>
    <main class="detalle" id="panel-detalle">
      <p class="vacio">Selecciona una contribución en la cola.</p>
    </main>
  </div>
  <script src="datos.js"></script>
  <script>
(function () {
  var REV = window.REVISIONES || [];
  var DIM_ORDER = [
    "cumplimiento_alcance",
    "calidad_tecnica",
    "riesgos_seguridad",
    "proporcionalidad"
  ];
  var DIM_LABEL = {
    cumplimiento_alcance: "Cumplimiento de alcance",
    calidad_tecnica: "Calidad técnica",
    riesgos_seguridad: "Riesgos y seguridad",
    proporcionalidad: "Proporcionalidad"
  };
  var REC_LABEL = {
    aprobar: "Aprobar",
    rechazar: "Rechazar",
    ajustar_monto: "Ajustar monto",
    derivar_revision_humana: "Derivar revisión humana"
  };
  var NIVEL_LABEL = {
    bajo: "bajo",
    medio: "medio",
    alto: "alto",
    spike: "spike"
  };
  var CA_RESULT = {
    cumple: "Cumple",
    no_cumple: "No cumple",
    no_verificable: "No verificable"
  };

  function esc(s) {
    if (s == null) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function idCorto(cid) {
    var s = String(cid || "");
    return s.length <= 10 ? s : s.slice(-10);
  }

  function etiquetaRec(val) {
    return REC_LABEL[val] || val || "n/d";
  }

  function claseRec(val) {
    return val ? "rec-" + val : "";
  }

  function etiquetaNivel(n) {
    if (!n) return "n/d";
    return NIVEL_LABEL[n] || n;
  }

  function ordenadas(datos) {
    return datos.slice().sort(function (a, b) {
      var pa = (a.priority && a.priority.score) || 0;
      var pb = (b.priority && b.priority.score) || 0;
      return pb - pa;
    });
  }

  var seleccionId = null;
  var filtroRec = "";

  function poblarFiltro(datos) {
    var sel = document.getElementById("filtro-rec");
    var vals = {};
    datos.forEach(function (r) {
      var v = (r.recommendation && r.recommendation.value) || "";
      if (v) vals[v] = true;
    });
    Object.keys(vals).sort().forEach(function (v) {
      var opt = document.createElement("option");
      opt.value = v;
      opt.textContent = etiquetaRec(v);
      sel.appendChild(opt);
    });
    sel.addEventListener("change", function () {
      filtroRec = sel.value;
      renderCola();
    });
  }

  function renderCola() {
    var ul = document.getElementById("lista-cola");
    ul.innerHTML = "";
    var datos = ordenadas(REV).filter(function (r) {
      if (!filtroRec) return true;
      return (r.recommendation && r.recommendation.value) === filtroRec;
    });
    if (!datos.length) {
      ul.innerHTML = '<li class="vacio">No hay revisiones para mostrar.</li>';
      return;
    }
    datos.forEach(function (r) {
      var li = document.createElement("li");
      li.className = "fila" + (r.contributionId === seleccionId ? " activa" : "");
      var rec = (r.recommendation && r.recommendation.value) || "";
      var rew = r.reward || {};
      var conf = r.confidence || {};
      li.innerHTML =
        '<div class="fila-id">' + esc(idCorto(r.contributionId)) + '</div>' +
        '<div><span class="chip ' + esc(claseRec(rec)) + '">' + esc(etiquetaRec(rec)) + '</span></div>' +
        '<div class="fila-meta">' +
          esc(etiquetaNivel(rew.suggestedLevel)) + " vs " +
          esc(etiquetaNivel(rew.requestedLevel)) + " · " +
          esc(String(rew.requestedAmount != null ? rew.requestedAmount : "n/d")) +
          ' · conf. ' + esc(conf.band || "n/d") +
        '</div>';
      li.addEventListener("click", function () {
        seleccionId = r.contributionId;
        renderCola();
        renderDetalle(r);
      });
      ul.appendChild(li);
    });
  }

  function listaHtml(items) {
    if (!items || !items.length) return "<p class=\"fila-meta\">Ninguno</p>";
    return "<ul class=\"plano\">" + items.map(function (x) {
      return "<li>" + esc(x) + "</li>";
    }).join("") + "</ul>";
  }

  function tablaAdmisibilidad(adm) {
    if (!adm || !adm.conditions) return "<p class=\"fila-meta\">Sin datos</p>";
    var rows = adm.conditions.map(function (c) {
      return "<tr><td>" + esc(c.code) + "</td><td>" + esc(CA_RESULT[c.result] || c.result) +
        "</td><td>" + esc(c.observed) + "</td></tr>";
    }).join("");
    return "<table><thead><tr><th>Código</th><th>Resultado</th><th>Observado</th></tr></thead><tbody>" +
      rows + "</tbody></table>";
  }

  function tablaCriterios(criteria) {
    var porDim = {};
    (criteria || []).forEach(function (c) {
      if (!porDim[c.dimension]) porDim[c.dimension] = [];
      porDim[c.dimension].push(c);
    });
    var html = "";
    DIM_ORDER.forEach(function (dim) {
      var lista = porDim[dim];
      if (!lista || !lista.length) return;
      html += "<h3>" + esc(DIM_LABEL[dim] || dim) + "</h3>";
      html += "<table><thead><tr><th>Criterio</th><th>Nivel</th><th>Evidencia</th><th>Archivo</th><th>Fragmento</th></tr></thead><tbody>";
      lista.forEach(function (c) {
        var frag = c.fragment
          ? "<pre class=\"frag\">" + esc(c.fragment) + "</pre>"
          : "n/d";
        html += "<tr><td>" + esc(c.code) + "</td>" +
          "<td class=\"nivel nivel-" + esc(c.level) + "\">" + esc(c.level) + "</td>" +
          "<td>" + esc(c.evidence) + "</td>" +
          "<td>" + esc(c.file || "n/d") + "</td>" +
          "<td>" + frag + "</td></tr>";
      });
      html += "</tbody></table>";
    });
    return html || "<p class=\"fila-meta\">Sin criterios</p>";
  }

  function renderDetalle(r) {
    var panel = document.getElementById("panel-detalle");
    if (!r) {
      panel.innerHTML = '<p class="vacio">Selecciona una contribución en la cola.</p>';
      return;
    }
    var adm = r.admissibility || {};
    var fc = r.fileClassification || {};
    var bt = fc.byType || {};
    var rv = fc.realVolume || {};
    var rew = r.reward || {};
    var rec = r.recommendation || {};
    var conf = r.confidence || {};
    var exe = r.execution || {};
    var mod = r.model || {};

    panel.innerHTML =
      '<div class="banner">Recomendación no vinculante. Requiere confirmación de una persona revisora.</div>' +
      "<section><h2>Admisibilidad (" + esc(adm.outcome || "") + ")</h2>" +
        (adm.stoppedAt ? "<p class=\"fila-meta\">Detenido en " + esc(adm.stoppedAt) + "</p>" : "") +
        tablaAdmisibilidad(adm) +
      "</section>" +
      "<section><h2>Clasificación de archivos</h2>" +
        "<p>Código: " + esc(bt.codigo) + " · Pruebas: " + esc(bt.pruebas) +
        " · Documentación: " + esc(bt.documentacion) + " · Generado: " + esc(bt.generado) +
        " · Configuración: " + esc(bt.configuracion) + "</p>" +
        "<p>Volumen real: " + esc(rv.files) + " archivos, +" + esc(rv.additions) +
        " / -" + esc(rv.deletions) + " líneas</p>" +
      "</section>" +
      "<section><h2>Recompensa</h2>" +
        '<div class="caja-recompensa">' +
          "<div>Solicitado: " + esc(rew.requestedAmount) + " (" + esc(etiquetaNivel(rew.requestedLevel)) + ")</div>" +
          "<div>Sugerido: " + esc(rew.suggestedAmount) + " (" + esc(etiquetaNivel(rew.suggestedLevel)) + ")</div>" +
        "</div>" +
        (rew.levelMismatch ? '<p class="alerta">Desajuste entre nivel solicitado y sugerido</p>' : "") +
      "</section>" +
      "<section><h2>Recomendación</h2>" +
        "<p><span class=\"chip " + esc(claseRec(rec.value)) + "\">" + esc(etiquetaRec(rec.value)) + "</span></p>" +
        "<p>" + esc(rec.justification) + "</p>" +
        "<p class=\"fila-meta\">Criterios de apoyo</p>" + listaHtml(rec.supportingCriteria) +
      "</section>" +
      "<section><h2>Confianza</h2>" +
        "<p>Puntuación: " + esc(conf.score) + " · Banda: " + esc(conf.band) +
        " · Supervisión: " + esc(conf.supervision) + "</p>" +
        "<p class=\"fila-meta\">Motivos</p>" + listaHtml(conf.reasons) +
      "</section>" +
      "<section><h2>Criterios (23)</h2>" + tablaCriterios(r.criteria) + "</section>" +
      "<section><h2>Señales de automatización</h2>" + listaHtml(r.automationSignals) + "</section>" +
      "<section><h2>Límites</h2>" + listaHtml(r.limits) + "</section>" +
      "<section><h2>Ejecución</h2>" +
        "<p>Modelo: " + esc(mod.name) + " (" + esc(mod.version) + ")</p>" +
        "<p>Versión de instrucción: " + esc(r.instructionVersion) + "</p>" +
        "<p>Ejecutado: " + esc(r.executedAt) + " · Duración: " + esc(exe.durationMs) + " ms</p>" +
        (exe.truncatedInput ? "<p class=\"fila-meta\">Entrada truncada</p>" : "") +
      "</section>";
  }

  if (!REV.length) {
    document.getElementById("lista-cola").innerHTML =
      '<li class="vacio">Carga datos.js con revisar --exportar-ui.</li>';
    return;
  }

  poblarFiltro(REV);
  seleccionId = ordenadas(REV)[0].contributionId;
  renderCola();
  renderDetalle(ordenadas(REV).find(function (x) { return x.contributionId === seleccionId; }));
})();
  </script>
</body>
</html>
